<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Paper Piano</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
</head>

<body>
    <div id="app">

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader-box">
                <h1>Paper Piano</h1>
                <p>Draw instruments on paper and play them with your hands</p>
                <div class="spinner"></div>
                <div id="loading-status">Initializing…</div>
            </div>
        </div>

        <!-- Main Interface -->
        <div id="main-interface" class="hidden">

            <!-- Full-bleed camera -->
            <div id="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay-canvas"></canvas>
                <canvas id="processing-canvas"></canvas>
            </div>

            <!-- Floating status pill -->
            <div id="status-pill">
                <span id="status-text">Loading…</span>
            </div>

            <!-- Bottom action bar -->
            <div id="action-bar">
                <div class="action-side">
                    <button id="btn-demo" class="action-secondary">Demo</button>
                    <button id="btn-clear" class="action-secondary action-clear hidden">Clear</button>
                </div>

                <button id="btn-primary" class="action-primary state-scan">
                    <span id="primary-label">Scan</span>
                </button>

                <div class="action-side">
                    <div id="instrument-picker">
                        <button class="inst-btn active" data-inst="piano">Piano</button>
                        <button class="inst-btn" data-inst="organ">Organ</button>
                        <button class="inst-btn" data-inst="synth">Synth</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Note Editor Bottom Sheet -->
        <div id="note-editor">
            <div class="sheet-backdrop"></div>
            <div class="sheet-content">
                <div class="sheet-handle"></div>
                <h3>Assign Note</h3>
                <div id="note-buttons"></div>
                <button id="btn-close-editor" class="action-secondary sheet-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- External Libraries (CDN) -->
    <script async src="https://docs.opencv.org/4.10.0/opencv.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Application (ES modules) -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
